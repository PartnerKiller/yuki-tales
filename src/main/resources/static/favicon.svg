<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0914"/>
      <stop offset="50%" stop-color="#131027"/>
      <stop offset="100%" stop-color="#1a153a"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(147, 112, 219, 0.3)" stroke-width="8"/>
  <rect width="480" height="480" x="16" y="16" rx="112" fill="none" stroke="url(#glowGrad)" stroke-width="6" opacity="0.4"/>

  <!-- Icon Group: Snowflake & Open Book Symbol -->
  <g filter="url(#neonGlow)" transform="translate(256, 256)">
    <!-- Book Wings/Pages -->
    <path d="M-130,-20 C-70,-60 -20,-40 0,-10 C20,-40 70,-60 130,-20 L130,90 C70,50 20,70 0,95 C-20,70 -70,50 -130,90 Z" fill="none" stroke="url(#glowGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0,-10 L0,95" stroke="url(#glowGrad)" stroke-width="20" stroke-linecap="round"/>

    <!-- Central Glowing Snowflake Cross -->
    <g stroke="url(#glowGrad)" stroke-width="20" stroke-linecap="round">
      <!-- Vertical branch -->
      <line x1="0" y1="-140" x2="0" y2="30"/>
      <path d="M-25,-115 L0,-140 L25,-115"/>
      <path d="M-20,-85 L0,-105 L20,-85"/>

      <!-- Diagonal right -->
      <line x1="0" y1="-50" x2="110" y2="-115"/>
      <path d="M75,-120 L110,-115 L95,-85"/>

      <!-- Diagonal left -->
      <line x1="0" y1="-50" x2="-110" y2="-115"/>
      <path d="M-75,-120 L-110,-115 L-95,-85"/>
    </g>

    <!-- Star Crystals -->
    <circle cx="0" cy="-50" r="14" fill="#ffffff"/>
    <circle cx="0" cy="-140" r="8" fill="#06b6d4"/>
    <circle cx="110" cy="-115" r="8" fill="#a855f7"/>
    <circle cx="-110" cy="-115" r="8" fill="#06b6d4"/>
  </g>
</svg>
